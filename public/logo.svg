<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="nearzyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>
    <filter id="nearzyShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#DC2626" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect x="6" y="6" width="88" height="88" rx="24" fill="url(#nearzyGrad)" filter="url(#nearzyShadow)"/>

  <!-- Inner Contrast Border -->
  <rect x="8" y="8" width="84" height="84" rx="22" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-opacity="0.3"/>

  <!-- Bold Modern 'N' Shape -->
  <path d="M30 72 V28 L70 72 V28" fill="none" stroke="#FFFFFF" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Local Service Location Pin Sparkle on top-right of N -->
  <circle cx="70" cy="24" r="6" fill="#0A0A0A" stroke="#FFFFFF" stroke-width="2.5"/>
</svg>
